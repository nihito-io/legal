name: Rechtstexte (HTML/PDF, GitHub Pages)

# Branches and PRs: build the working tree as a preview artifact, no deploy.
# legal-* tags and manual runs: build every legal-* tag and deploy the whole site to Pages.

on:
  push:
    branches: [ "**" ]
    tags:
      - "legal-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-${{ github.ref }}
  cancel-in-progress: true

env:
  # Document id (used in the published URLs and by planner-platform) = Markdown file.
  # Paths must stay stable: every tag is built again on each release.
  LEGAL_DOCUMENTS: >-
    terms=nutzungsbedingungen.md,
    privacy=datenschutzerklaerung.md,
    dpa=avv.md
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/legal-') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all legal-* tags are built on release

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-german

      - name: Download & install Google Font Teachers
        run: |
          set -euo pipefail

          mkdir -p fonts

          # Fetch CSS
          curl -fsSL -A "Mozilla/5.0" \
            "https://fonts.googleapis.com/css2?family=Teachers:wght@400;600;700;800&display=swap" \
            -o fonts/teachers.css

          # Extract and download the TTF files
          grep -oE 'https://fonts\.gstatic\.com[^)"]+' fonts/teachers.css | sort -u | while read -r url; do
            [ -z "$url" ] && continue
            fname="$(basename "${url%%\?*}")"
            curl -fsSL "$url" -o "fonts/$fname"
          done

          # Install TTFs and refresh cache
          mkdir -p ~/.local/share/fonts
          mv fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f

          # Verify
          fc-list | grep -i "Teachers" >/dev/null

      - name: Build preview
        if: env.IS_RELEASE != 'true'
        run: python3 tools/build.py preview --out preview

      - name: Upload preview artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rechtstexte-preview
          path: preview
          if-no-files-found: error
          retention-days: 14

      - name: Build all released versions
        if: env.IS_RELEASE == 'true'
        run: python3 tools/build.py release --out site

      - name: Configure Pages
        if: env.IS_RELEASE == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: startsWith(github.ref, 'refs/tags/legal-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
